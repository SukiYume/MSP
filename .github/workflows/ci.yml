name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: python -m pip install "mypy>=1.10" "ruff>=0.4" "vulture>=2.11"

      - name: Check lint and formatting
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
          python -m mypy
          python -m vulture

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core test suite
        run: python -m pytest -q --cov=radiosonify --cov-report=term-missing --cov-fail-under=90

  optional-model-contracts:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install all optional backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Run optional model contract tests
        run: >-
          python -m pytest -q
          tests/test_hifigan.py
          tests/test_musicnet.py
          tests/test_rave.py
          tests/test_vendored_models.py

  minimum-huggingface-hub:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install the declared minimum Hub version
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub==0.20.0"
          python -m pip install -e ".[dev]"

      - name: Verify minimum-version imports and Hub behavior
        run: |
          python -c "import huggingface_hub, radiosonify.hub; assert huggingface_hub.__version__ == '0.20.0'"
          python -m pytest -q tests/test_hub.py

  release-artifacts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
              payload = b"\n".join(
                  archive.read(name)
                  for name in names
                  if "license" in name.lower() or name.endswith("METADATA")
              )
          assert b"MIT AND CC-BY-NC-4.0" in payload
          assert b"MIT License" in payload
          assert b"Attribution-NonCommercial 4.0 International" in payload
          assert any(name.endswith("radiosonify/cli.py") for name in names)
          for module in (
              "planning.py",
              "pipeline.py",
              "validation.py",
              "array_ops.py",
              "audio_io.py",
              "runtime.py",
          ):
              assert any(name.endswith(f"radiosonify/{module}") for name in names)
          assert not any(name.endswith("radiosonify/core.py") for name in names)

          sdist = glob.glob("dist/*.tar.gz")
          assert len(sdist) == 1, sdist
          with tarfile.open(sdist[0]) as archive:
              source_names = archive.getnames()
          for document in (
              "CHANGELOG.md",
              "README.md",
              "README_CN.md",
              "THIRD_PARTY_NOTICES.md",
          ):
              assert any(name.endswith(f"/{document}") for name in source_names)
          assert not any(name.endswith("/src/radiosonify/core.py") for name in source_names)
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import radiosonify; assert radiosonify.__version__ == '0.3.0'"
          "$RUNNER_TEMP/wheel-smoke/bin/radiosonify" list-methods
